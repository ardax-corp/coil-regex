name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"

jobs:
  test:
    name: coil test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: coil-lang

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libffi-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - name: Build coil
        run: cargo build --bin coil --bin coil-test
        working-directory: coil-lang

      - name: Test
        run: make test
        env:
          COIL: ${{ github.workspace }}/coil-lang/target/debug/coil
