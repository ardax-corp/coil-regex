name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"

jobs:
  native:
    name: native (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gnu
            os: ubuntu-latest
          - id: linux-musl
            os: ubuntu-latest
            musl: true
          - id: macos
            os: macos-latest
          - id: windows-gnu
            os: windows-latest
            windows: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Ubuntu glibc)
        if: matrix.os == 'ubuntu-latest' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev build-essential

      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install pcre2

      - name: Install deps (Windows)
        if: matrix.windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-pkgconf

      - name: Build artifact + smoke (glibc / macOS)
        if: ${{ !matrix.musl && !matrix.windows }}
        run: make smoke

      - name: Build artifact + smoke (Windows gnu)
        if: matrix.windows
        shell: msys2 {0}
        run: |
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          make smoke

      - name: Build artifact + smoke (linux-musl)
        if: matrix.musl
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            rust:1-alpine \
            sh -c '
              set -eu
              apk add --no-cache build-base pcre2-dev pkgconf make
              make smoke
            '

  test:
    name: coil test (ubuntu)
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev build-essential

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Build native artifact
        run: make

      - name: Test
        run: make test
